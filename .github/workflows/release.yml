name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # 汉字.html 不入库，发版时用 index.html 现场生成
      # 再用 ASCII 文件名上传，避免中文名被 GitHub 兜底成 default.html
      - name: 生成单文件版
        run: |
          python3 build.py
          cp 汉字.html hanzi-big.html

      - name: 上传到 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: hanzi-big.html
          generate_release_notes: true
